[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mywork-agents"
version = "0.1.0"
description = "Claude-powered AI agents for everyday work: daily plans, standups, inbox triage, meeting notes, research briefs, code review and commit messages."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chanda Charan Reddy" }]
keywords = ["ai", "agents", "claude", "anthropic", "productivity", "cli", "code-review", "standup"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "anthropic>=1.15,<2",
  "httpx2>=2.0",
  "pydantic>=2.7,<3",
  "rich>=13.7",
  "typer>=0.12",
  "tomli>=2.0; python_version < '3.11'",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "tomli>=2.0",
]

[project.scripts]
mywork = "mywork_agents.cli:main"

[project.urls]
Homepage = "https://github.com/charanreddy-27/Mywork-agents"
Issues = "https://github.com/charanreddy-27/Mywork-agents/issues"
Changelog = "https://github.com/charanreddy-27/Mywork-agents/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/mywork_agents"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PTH", "PL"]
ignore = [
  "PLR0911", # many return statements are fine in small dispatchers
  "PLR0912",
  "PLR0913", # CLI commands legitimately take many options
  "PLR0915",
  "PLR0917", # Typer commands declare every option as a parameter
  "PLR2004", # magic values in tests and limits are clearer inline
  "B008",    # typer.Option in defaults is the Typer idiom
  "PLC0415", # deliberate lazy imports keep CLI start-up fast
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["mywork_agents"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
